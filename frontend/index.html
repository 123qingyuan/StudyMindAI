<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/studymind-app-icon.svg" />
    <meta name="theme-color" content="#f6f7fb" />
    <title>StudyMind AI 2.0 · 智学助手</title>
    <script>
      (() => { let mode = 'system'; try { mode = localStorage.getItem('studymind.theme') || 'system' } catch {} const dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.classList.toggle('dark', dark); document.documentElement.dataset.theme = dark ? 'dark' : 'light'; document.documentElement.style.colorScheme = dark ? 'dark' : 'light' })()
    </script>
    <style>html{background:#f3f5f8}html.dark{background:#10151f}</style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
